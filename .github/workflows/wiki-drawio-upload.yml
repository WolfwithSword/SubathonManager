name: Update Wiki Drawio

on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: false
        default: nightly
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: nightly

jobs:
  update:
    name: Update Wiki Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Normalize release tag
        id: version
        run: |
          TAG="${{ inputs.release_tag || 'nightly' }}"
          
          if [[ "$TAG" == "nightly" || "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          else
          echo "Invalid release tag '$TAG', using nightly."
          echo "release_tag=nightly" >> "$GITHUB_OUTPUT"
          fi
          
      - name: Check if wiki repository exists
        id: wiki-check
        run: |
          set -e
          WIKI_URL="https://github.com/${{ github.repository }}-docs.git"
          if git ls-remote "$WIKI_URL" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if no wiki exists
        if: steps.wiki-check.outputs.exists == 'false'
        run: echo "Wiki does not exist - skipping update."
          
      - name: Checkout Wiki Repository
        if: steps.wiki-check.outputs.exists == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}-docs
          token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          
      - name: Download draw.io file from Nextcloud
        if: steps.wiki-check.outputs.exists == 'true'
        run: |
          mkdir -p docs
          curl -L "${{ vars.NEXTCLOUD_DRAWIO_URL }}" \
            -o "wiki/docs/SubathonManager_Design.drawio"
          
      - name: Render drawio to svg
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: "wiki/docs/SubathonManager_Design.drawio"
          format: svg
          output: ./
          all-pages: true
          transparent: false
          svg-theme: dark
          action-mode: all

      - name: Commit drawio file
        if: steps.wiki-check.outputs.exists == 'true'
        run: |
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          echo "===Listing docs files==="
          ls wiki/docs
          echo "========================"
          
          git add "wiki/docs/SubathonManager_Design.drawio"
          git add "wiki/docs/*.svg"

          if git diff --cached --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "Update Subathon_Manager.drawio for release ${{ steps.version.outputs.release_tag }}"
            git push
          fi
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
  
  trigger-docs-release:
    runs-on: ubuntu-latest
    needs: update
    if: ${{ needs.update.result == 'success' && needs.version.outputs.release_tag != 'nightly' && needs.version.outputs.release_tag != '' }}
    steps:
      - name: Dispatch docs release
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.version.outputs.release_tag }}
        with:
          github-token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          script: |
            const version = process.env.VERSION;
            if (!version || version === 'nightly') {
              core.setFailed(`Refusing to dispatch a docs release for version '${version}'.`);
              return;
            }
            await github.rest.repos.createDispatchEvent({
              owner: 'WolfwithSword',
              repo:  'SubathonManager-docs',
              event_type: 'docs-release',
              client_payload: { version }
            });
